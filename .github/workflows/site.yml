name: Instructions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: modelkin
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: modelkin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelkin -d modelkin"
          --health-interval 5s --health-timeout 4s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://modelkin:ci-password@localhost:5432/modelkin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the editor from source
        run: |
          npm --prefix frontend ci --include=dev
          npm --prefix frontend run build
      - name: Restore Cargo dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check formatting, Rust and JavaScript
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          node --check static/admin.js
      - name: Run tests with PostgreSQL
        run: cargo test --locked -- --include-ignored

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: modelkin-instruction:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=modelkin-instruction
          cache-to: type=gha,mode=max,scope=modelkin-instruction
      - name: Start the production image with a fresh database
        env:
          APP_IMAGE: modelkin-instruction:${{ github.sha }}
          POSTGRES_ADMIN_PASSWORD: runner-only-admin
          POSTGRES_PASSWORD: runner-only-app
          PROXY_NETWORK: modelkin-ci-proxy
        run: |
          docker network create "$PROXY_NETWORK"
          stack=(docker compose -p modelkin-ci -f deploy/compose.yml)
          trap '"${stack[@]}" down -v; docker network rm "$PROXY_NETWORK"' EXIT
          "${stack[@]}" up -d --wait --wait-timeout 180 || { "${stack[@]}" logs; exit 1; }
          check() { "${stack[@]}" exec -T app curl -fsS "http://127.0.0.1:8080/$1"; }
          [[ "$(check healthz)" == "$GITHUB_SHA" ]]
          for asset in figma-editor.js figma-editor.css; do
            check "static/$asset" > "$RUNNER_TEMP/$asset"
            test -s "$RUNNER_TEMP/$asset"
          done
      - name: Package the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "modelkin-instruction:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: production-image
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: modelkin-publish-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-image
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gzip -dc "$RUNNER_TEMP/image.tar.gz" | docker load
          docker tag "modelkin-instruction:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            docker tag "$image:$GITHUB_SHA" "$image:main"
            docker push "$image:main"
          fi
